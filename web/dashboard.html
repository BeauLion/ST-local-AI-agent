<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agent Dashboard</title>
<link rel="stylesheet" href="/settings_panel.css">
<link rel="stylesheet" href="/prompt_log_viewer.css">
<style>
  /* Combined-page chrome only - the two tabs' own stylesheets are loaded
     as-is above. Only fix up what breaks from running both on one page:
     body's own box model (settings_panel.css puts padding on body itself,
     which would throw off the log viewer's sticky header/sidebar math),
     and the settings tab's max-width wrapper (previously done via body
     padding, now scoped to its own panel instead). */
  body { margin: 0; padding: 0; }
  #tab-settings .wrap { max-width: 720px; margin: 0 auto; padding: 24px; }

  .tab-bar {
    display: flex;
    gap: 4px;
    padding: 0 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-dim, var(--muted));
    padding: 12px 16px;
    font-size: 13px;
    font-family: var(--sans, inherit);
    cursor: pointer;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
</style>
</head>
<body>

<nav class="tab-bar">
  <button class="tab-btn" data-tab="logs">Prompt Log</button>
  <button class="tab-btn" data-tab="settings">Settings</button>
</nav>

<section id="tab-logs" class="tab-panel">
  <header>
    <h1>Prompt &amp; Console Log Viewer</h1>
    <select id="fileSelect"></select>
    <input type="text" id="searchBox" placeholder="Search chunk content...">
    <button id="expandAllBtn">Expand all</button>
    <button id="collapseAllBtn">Collapse all</button>
    <button id="noteSearchBtn">Search notes&hellip;</button>
    <span id="saveStatus"></span>
  </header>

  <div id="noteSearchOverlay" class="note-search-overlay hidden">
    <div class="note-search-panel">
      <div class="note-search-head">
        <input type="text" id="noteSearchInput" placeholder="Search note content across all sessions...">
        <button id="noteSearchCloseBtn">Close</button>
      </div>
      <div class="note-search-status" id="noteSearchStatus"></div>
      <div id="noteSearchResults" class="note-search-results"></div>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <h2>Request</h2>
      <div id="requestFilter"></div>
      <h2>Role</h2>
      <div id="roleFilters"></div>
      <h2>Chunk / Section</h2>
      <div id="sectionFilters"></div>
    </div>

    <main>
      <div class="status" id="status">Loading...</div>
      <div id="results"></div>
    </main>
  </div>
</section>

<section id="tab-settings" class="tab-panel">
  <div class="wrap">
    <header>
      <h1>Agent Settings</h1>
      <p class="sub">Changes apply immediately — no restart needed. Model/port/context still require restarting <code>start.py</code>.</p>
    </header>
    <div id="settingsStatus" class="status" hidden></div>
    <div id="groups"></div>
    <footer>
      <button id="reset-all" class="danger">Reset everything to config.py defaults</button>
    </footer>
  </div>
</section>

<script src="/prompt_log_viewer.js" defer></script>
<script src="/settings_panel.js" defer></script>
<script>
  // Tab switching, plus remembering the last-open tab per browser (not
  // synced anywhere - purely a local convenience) so a refresh lands back
  // where you left off instead of always defaulting to the log viewer.
  (function () {
    const STORAGE_KEY = "agent-dashboard-tab";
    const buttons = document.querySelectorAll(".tab-btn");
    const panels = document.querySelectorAll(".tab-panel");

    function activate(tab) {
      buttons.forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
      panels.forEach((p) => p.classList.toggle("active", p.id === "tab-" + tab));
      try { localStorage.setItem(STORAGE_KEY, tab); } catch (e) { /* ignore */ }
    }

    buttons.forEach((btn) => {
      btn.onclick = () => activate(btn.dataset.tab);
    });

    let initial = "logs";
    try { initial = localStorage.getItem(STORAGE_KEY) || "logs"; } catch (e) { /* ignore */ }
    activate(initial);
  })();
</script>
</body>
</html>
