<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Gantt Chart</title>
<link rel="stylesheet" href="/vendor/frappe-gantt.css">
<style>
  :root {
    --bg: #1e1f24;
    --panel: #26282f;
    --border: #383a42;
    --text: #e6e6e6;
    --muted: #9a9ca3;
    --accent: #5b8cff;
    --danger: #e0555f;
    --ok: #4caf7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .wrap { max-width: 1800px; margin: 0 auto; } 
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }

  .status {
    position: fixed; /* position of the status massages such as "saved" */
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    z-index: 2000;
    background: var(--panel);
  }
  .status.ok { background: rgba(76,175,125,0.12); color: var(--ok); }
  .status.err { background: rgba(224,85,95,0.12); color: var(--danger); }
  .status[hidden] { display: none; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

  #ganttEmpty { color: var(--muted); font-size: 13px; padding: 12px 0; }

  /* --- collapsible panel header (used by the "Set project dates" panel) --- */
  .panel-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: none;
    border: none;
    padding: 0;
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: .04em;
    cursor: pointer;
    text-align: left;
  }
  .panel-toggle .chevron {
    display: inline-block;
    font-size: 10px;
    transition: transform 0.15s ease;
  }
  .panel-toggle[aria-expanded="false"] .chevron { transform: rotate(-90deg); }
  .panel-toggle[aria-expanded="false"] { margin-bottom: 0; }

  /* --- date-setting form --- */
  .date-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  .date-form[hidden] { display: none; }
  .date-form .field { display: flex; flex-direction: column; gap: 4px; }
  .date-form label { font-size: 11px; color: var(--muted); }
  .date-form select, .date-form input {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
  }
  .date-form button {
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .date-form .save { background: var(--accent); color: white; }
  .date-form .clear { background: transparent; color: var(--danger); border: 1px solid var(--border); }

  /* --- bar colours, matched to project_manager._gantt_bar_class --- */
  .gantt-bar-low .bar { fill: #4a4d57; }
  .gantt-bar-mid .bar { fill: #c9922c; }
  .gantt-bar-high .bar { fill: #5b8cff; }
  .gantt-bar-done .bar { fill: #4caf7d; }
  .gantt-bar-paused .bar { fill: #6b6d76; }
  .gantt-bar-low .bar-progress,
  .gantt-bar-mid .bar-progress,
  .gantt-bar-high .bar-progress,
  .gantt-bar-done .bar-progress,
  .gantt-bar-paused .bar-progress { fill: rgba(255,255,255,0.35); }

  /* thickened border on the bar clicked most recently, to show it's selected */
  .bar-wrapper.selected .bar {
    stroke: var(--accent);
    stroke-width: 2.5;
  }

  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  /* --- chart area: task sidebar (left) + resizable chart (right) --- */
  .chart-area { display: flex; gap: 16px; align-items: stretch; }

  .task-sidebar {
    position: relative;
    width: 260px;
    flex: 0 0 260px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    padding-top: 30px;
    overflow-y: auto;
    background: var(--bg);
    transition: flex-basis 0.15s ease, width 0.15s ease, padding 0.15s ease;
  }
  .task-sidebar.collapsed {
    width: 28px;
    flex: 0 0 28px;
    padding: 12px 0 0;
    overflow: hidden;
  }
  .task-sidebar.collapsed .task-sidebar-content { display: none; }
  .sidebar-toggle {
    position: absolute;
    top: 6px;
    right: 6px;
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    width: 20px;
    height: 20px;
    line-height: 1;
    font-size: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sidebar-toggle:hover { color: var(--text); }
  .task-sidebar.collapsed .sidebar-toggle {
    position: static;
    margin: 0 auto;
  }
  .task-sidebar h3 {
    font-size: 12px;
    margin: 0 0 4px;
    color: var(--text);
  }
  .task-sidebar .proj-code { color: var(--muted); font-weight: normal; }
  .task-sidebar .hint { color: var(--muted); font-size: 12px; }
  .task-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .task-list li {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font-size: 12px;
  }
  .task-title { display: block; margin-bottom: 4px; }
  .task-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; }
  .task-status {
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: .03em;
    padding: 1px 6px;
    border-radius: 4px;
    display: inline-block;
  }
  .task-status.pending { background: rgba(154,156,163,0.18); color: var(--muted); }
  .task-status.active { background: rgba(91,140,255,0.18); color: var(--accent); }
  .task-status.blocked { background: rgba(224,85,95,0.18); color: var(--danger); }
  .task-status.done { background: rgba(76,175,125,0.18); color: var(--ok); }
  .task-status.cancelled { background: rgba(154,156,163,0.12); color: var(--muted); }
  .task-status.paused { background: rgba(154,156,163,0.18); color: var(--muted); }
  .task-status.completed { background: rgba(76,175,125,0.18); color: var(--ok); }

  /* the chart itself grows to fit every rendered row; .gantt-container (inside)
     handles its own horizontal scrolling, so this wrapper just sizes/borders it */
  .chart-scroll {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
  }

  .zoom-controls {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 10px;
  }
  .zoom-controls button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .zoom-controls button:hover { filter: brightness(1.15); }
  .zoom-controls button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  /* --- project board (kanban) --- */
  #boardPanel .hint { color: var(--muted); font-size: 12px; }
  .board-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .board-panel-header h2 { margin: 0; }
  .board-edit-toggle {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
  }
  .board-edit-toggle:hover { color: var(--text); }
  .board-edit-toggle.active {
    background: var(--ok);
    border-color: var(--ok);
    color: #fff;
  }
  .board {
    display: flex;
    gap: 12px;
    overflow-x: auto;
  }
  .board-col {
    flex: 1 1 0;
    min-width: 160px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .board-col.drag-over {
    border-color: var(--accent);
    background: rgba(91,140,255,0.06);
  }
  .board-col-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
    padding: 2px 2px 6px;
    border-bottom: 1px solid var(--border);
  }
  .board-col-count {
    background: var(--panel);
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 11px;
  }
  .board-cards {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 40px;
  }
  .board-card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font-size: 12px;
    cursor: grab;
  }
  .board-card.dragging { opacity: 0.4; }
  .board-card .card-title { display: block; margin-bottom: 4px; padding-right: 14px; }
  .board-card .card-note {
    display: block;
    color: var(--muted);
    font-size: 11px;
    white-space: pre-wrap;
  }
  .board-card .card-deadline {
    display: block;
    color: var(--accent);
    font-size: 11px;
    margin-bottom: 4px;
  }
  .board-card .card-properties {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 4px;
  }
  .board-card .card-priority-flag {
    position: absolute;
    top: 6px;
    right: 6px;
    color: var(--danger);
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
  }
  .board-card.editing { cursor: default; }
  .board-card .card-title-input,
  .board-card .card-note-input {
    display: block;
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 12px;
    font-family: inherit;
    margin-bottom: 6px;
    box-sizing: border-box;
  }
  .board-card .card-note-input { resize: vertical; min-height: 40px; }
  .board-card .card-deadline-wrap {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }
  .board-card .card-deadline-wrap input {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 11px;
    font-family: inherit;
    box-sizing: border-box;
  }
  .board-card .card-deadline-date-input { flex: 1 1 60%; }
  .board-card .card-deadline-time-input { flex: 1 1 40%; }
  .board-card .card-duration-input,
  .board-card .card-effort-select {
    display: block;
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 11px;
    font-family: inherit;
    margin-bottom: 6px;
    box-sizing: border-box;
  }
  .board-card .card-when-wrap {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }
  .board-card .card-when-wrap select {
    flex: 1 1 50%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 11px;
    font-family: inherit;
    box-sizing: border-box;
  }
  .board-card .card-priority-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
  }

  /* floating date label shown while dragging a bar's edge handle */
  .bar-drag-label {
    position: fixed;
    display: none;
    background: var(--accent);
    color: white;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 7px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 1000;
  }
  .bar-drag-label::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 4px solid transparent;
    border-top-color: var(--accent);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Project Gantt Chart</h1>
  </header>

  <div id="statusBox" class="status" hidden></div>

  <div class="panel" id="datesPanel">
    <button type="button" class="panel-toggle" id="datesToggle" aria-expanded="true" aria-controls="datesBody">
      <span class="chevron">&#9660;</span> Set project dates
    </button>
    <div class="date-form" id="datesBody">
      <div class="field">
        <label for="projectSelect">Project</label>
        <select id="projectSelect"></select>
      </div>
      <div class="field">
        <label for="startInput">Start</label>
        <input type="date" id="startInput">
      </div>
      <div class="field">
        <label for="endInput">End</label>
        <input type="date" id="endInput">
      </div>
      <button class="save" id="saveBtn">Save</button>
      <button class="clear" id="clearBtn">Clear dates</button>
    </div>
  </div>

  <div class="panel">
    <h2>Chart</h2>
    <div id="ganttEmpty" hidden>No projects have both a start and end date set yet — use the form above to add one.</div>
    <div class="chart-area" id="chartArea">
      <div class="task-sidebar" id="taskSidebar">
        <button type="button" class="sidebar-toggle" id="sidebarToggle" title="Collapse">&#9664;</button>
        <div class="task-sidebar-content" id="taskSidebarContent">
          <p class="hint">Click a bar to see that project's tasks here.</p>
        </div>
      </div>
      <div class="chart-scroll" id="chartScroll">
        <svg id="gantt"></svg>
      </div>
    </div>
    <div class="zoom-controls">
      <button type="button" id="zoomOutBtn" title="Month view">Zoom out</button>
      <button type="button" id="zoomInBtn" title="Week view">Zoom in</button>
    </div>
    <div class="legend">
      <span><i class="swatch" style="background:#4a4d57"></i>Not started</span>
      <span><i class="swatch" style="background:#c9922c"></i>In progress</span>
      <span><i class="swatch" style="background:#5b8cff"></i>Over halfway</span>
      <span><i class="swatch" style="background:#4caf7d"></i>Done</span>
      <span><i class="swatch" style="background:#6b6d76"></i>Paused</span>
    </div>
  </div>

  <div class="panel" id="boardPanel">
    <div class="board-panel-header">
      <h2>Project Board</h2>
      <button type="button" class="board-edit-toggle" id="boardEditToggle" title="Edit tasks" aria-pressed="false">&#9998;</button>
    </div>
    <p class="hint" id="boardHint">Select a project bar in the chart above to see its board here.</p>
    <div class="board" id="board" hidden></div>
  </div>
</div>

<script src="/vendor/frappe-gantt.umd.js"></script>
<script>
(function () {
  const statusBox = document.getElementById("statusBox");
  const projectSelect = document.getElementById("projectSelect");
  const startInput = document.getElementById("startInput");
  const endInput = document.getElementById("endInput");
  const ganttEmpty = document.getElementById("ganttEmpty");
  const chartArea = document.getElementById("chartArea");
  const taskSidebar = document.getElementById("taskSidebar");
  const taskSidebarContent = document.getElementById("taskSidebarContent");
  const sidebarToggle = document.getElementById("sidebarToggle");
  const zoomOutBtn = document.getElementById("zoomOutBtn");
  const zoomInBtn = document.getElementById("zoomInBtn");
  const datesToggle = document.getElementById("datesToggle");
  const datesBody = document.getElementById("datesBody");
  const board = document.getElementById("board");
  const boardHint = document.getElementById("boardHint");
  const boardEditToggle = document.getElementById("boardEditToggle");
  let ganttInstance = null;
  let projectsById = {};
  let currentViewMode = "Week";
  let activeDrag = null; // { taskId, side } while a bar's left/right handle is being dragged
  let dragLabelEl = null;
  let boardProjectId = null;
  let boardEditMode = false;
  const TASK_STATUSES = [
    { key: "pending", label: "Pending" },
    { key: "active", label: "Active" },
    { key: "blocked", label: "Blocked" },
    { key: "done", label: "Done" },
    { key: "cancelled", label: "Cancelled" },
  ];

  function setViewMode(mode) {
    currentViewMode = mode;
    if (ganttInstance) ganttInstance.change_view_mode(mode);
    zoomOutBtn.classList.toggle("active", mode === "Month");
    zoomInBtn.classList.toggle("active", mode === "Week");
  }

  function showStatus(message, ok) {
    statusBox.textContent = message;
    statusBox.className = "status " + (ok ? "ok" : "err");
    statusBox.hidden = false;
    setTimeout(() => { statusBox.hidden = true; }, 4000);
  }

  function formatDate(iso) {
    if (!iso) return "";
    // completed_at is a full UTC ISO timestamp; show just the date part
    // in the browser's local time so it reads naturally next to the task.
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  function formatDeadline(value) {
    if (!value) return "";
    // "YYYY-MM-DD" (date only) or "YYYY-MM-DDTHH:MM" (date+time), matching
    // the <input type="date"|"datetime-local"> value format - see
    // project_manager._parse_task_deadline. Built as local-time components
    // rather than `new Date(value)` directly: a bare "YYYY-MM-DD" string
    // parses as UTC midnight per spec, which can render as the previous day
    // in negative-UTC-offset timezones.
    const hasTime = value.includes("T");
    const [datePart, timePart] = value.split("T");
    const [y, m, d] = datePart.split("-").map(Number);
    const date = hasTime
      ? new Date(y, m - 1, d, ...timePart.split(":").map(Number))
      : new Date(y, m - 1, d);
    if (isNaN(date.getTime())) return value;
    const opts = { year: "numeric", month: "short", day: "numeric" };
    if (hasTime) {
      opts.hour = "numeric";
      opts.minute = "2-digit";
    }
    return date.toLocaleString(undefined, opts);
  }

  function formatDurationInput(minutes) {
    // Mirrors project_manager._format_duration_tag's "1h30m"/"2h"/"45m"
    // shape - the edit-mode duration input round-trips through this same
    // compact text, and the backend parser (_parse_task_duration, via
    // duration_manager.parse_duration_minutes) accepts it back unchanged.
    const total = Math.round(minutes);
    const hours = Math.floor(total / 60);
    const mins = total % 60;
    if (hours && mins) return `${hours}h${mins}m`;
    if (hours) return `${hours}h`;
    return `${mins}m`;
  }

  function formatTaskProperties(t) {
    // Client-side mirror of project_manager._format_task_properties_inline
    // for the board card's view-mode badge.
    const parts = [];
    if (t.duration_minutes != null) parts.push(`~${formatDurationInput(t.duration_minutes)}`);
    if (t.effort) parts.push(`${t.effort} effort`);
    if (t.when) parts.push(t.when);
    return parts.join(" · ");
  }

  async function loadProjects() {
    const res = await fetch("/projects");
    const data = await res.json();
    projectsById = {};
    projectSelect.innerHTML = "";
    for (const p of data.projects) {
      projectsById[p.id] = p;
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = `${p.short_code} \u2014 ${p.name}`;
      projectSelect.appendChild(opt);
    }
    if (projectSelect.value) fillDatesFromSelection();
  }

  function fillDatesFromSelection() {
    const p = projectsById[projectSelect.value];
    startInput.value = (p && p.gantt_start) || "";
    endInput.value = (p && p.gantt_end) || "";
  }

  async function showProjectTasks(projectId) {
    taskSidebarContent.innerHTML = '<p class="hint">Loading tasks\u2026</p>';
    try {
      const childRes = await fetch(`/gantt/${projectId}/children`);
      if (childRes.ok) {
        const { children } = await childRes.json();
        if (children.length) {
          const parent = projectsById[projectId];
          const header = parent
            ? `<h3>${parent.short_code} <span class="proj-code">\u2014 ${parent.name}</span></h3>`
            : "";
          const items = children.map((c) => `<li>
            <span class="task-title">${c.short_code} \u2014 ${c.name}</span>
            <div class="task-meta"><span class="task-status ${c.status}">${c.status}</span></div>
          </li>`).join("");
          taskSidebarContent.innerHTML = header + '<p class="hint">Child projects</p>' + `<ul class="task-list">${items}</ul>`;
          return;
        }
      }
    } catch (e) {
      // Children lookup failing shouldn't block the normal task view below.
    }
    try {
      const res = await fetch(`/projects/${projectId}`);
      if (!res.ok) throw new Error("Could not load that project.");
      const project = await res.json();
      const tasks = Object.values(project.tasks || {});
      const header = `<h3>${project.short_code} <span class="proj-code">\u2014 ${project.name}</span></h3>`;
      if (!tasks.length) {
        taskSidebarContent.innerHTML = header + '<p class="hint">No tasks in this project.</p>';
        return;
      }
      tasks.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
      const items = tasks.map((t) => {
        const doneLine = t.status === "done" && t.completed_at
          ? `<div class="task-meta"><span>Completed</span><span>${formatDate(t.completed_at)}</span></div>`
          : "";
        const deadlineLine = t.deadline
          ? `<div class="task-meta"><span>Due</span><span>${formatDeadline(t.deadline)}</span></div>`
          : "";
        const properties = formatTaskProperties(t);
        const propertiesLine = properties
          ? `<div class="task-meta"><span>${properties}</span></div>`
          : "";
        return `<li>
          <span class="task-title">${t.title}</span>
          <div class="task-meta">
            <span class="task-status ${t.status}">${t.status}</span>
          </div>
          ${deadlineLine}
          ${propertiesLine}
          ${doneLine}
        </li>`;
      }).join("");
      taskSidebarContent.innerHTML = header + `<ul class="task-list">${items}</ul>`;
    } catch (e) {
      taskSidebarContent.innerHTML = `<p class="hint">${e.message}</p>`;
    }
  }

  async function loadBoard(projectId) {
    boardProjectId = projectId;
    boardHint.hidden = false;
    boardHint.textContent = "Loading board…";
    board.hidden = true;
    try {
      const res = await fetch(`/projects/${projectId}`);
      if (!res.ok) throw new Error("Could not load that project.");
      const project = await res.json();
      renderBoard(project);
    } catch (e) {
      boardHint.textContent = e.message;
    }
  }

  async function saveTaskField(taskId, patch) {
    try {
      const res = await fetch(`/projects/${boardProjectId}/tasks/${taskId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(patch),
      });
      if (!res.ok) throw new Error((await res.json()).detail || "Request failed");
      showStatus("Saved.", true);
    } catch (err) {
      showStatus(err.message, false);
    }
  }

  function setBoardEditMode(enabled) {
    boardEditMode = enabled;
    boardEditToggle.classList.toggle("active", enabled);
    boardEditToggle.setAttribute("aria-pressed", String(enabled));
    boardEditToggle.title = enabled ? "Editing tasks (click to lock)" : "Edit tasks";
    if (boardProjectId) loadBoard(boardProjectId);
  }

  boardEditToggle.addEventListener("click", () => setBoardEditMode(!boardEditMode));

  function renderBoard(project) {
    const tasks = Object.values(project.tasks || {});
    tasks.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
    board.innerHTML = "";
    for (const s of TASK_STATUSES) {
      const col = document.createElement("div");
      col.className = "board-col";
      col.dataset.status = s.key;

      const header = document.createElement("div");
      header.className = "board-col-header";
      const colTasks = tasks.filter((t) => t.status === s.key);
      header.innerHTML = `<span>${s.label}</span><span class="board-col-count">${colTasks.length}</span>`;
      col.appendChild(header);

      const cards = document.createElement("div");
      cards.className = "board-cards";
      for (const t of colTasks) {
        const card = document.createElement("div");
        card.className = "board-card";
        card.dataset.taskId = t.id;

        if (boardEditMode) {
          card.classList.add("editing");
          card.draggable = false;

          const titleInput = document.createElement("input");
          titleInput.type = "text";
          titleInput.className = "card-title-input";
          titleInput.value = t.title;
          titleInput.addEventListener("change", () => saveTaskField(t.id, { title: titleInput.value }));

          const notesInput = document.createElement("textarea");
          notesInput.className = "card-note-input";
          notesInput.placeholder = "Notes";
          notesInput.value = t.notes || "";
          notesInput.addEventListener("change", () => saveTaskField(t.id, { notes: notesInput.value }));

          const priorityLabel = document.createElement("label");
          priorityLabel.className = "card-priority-toggle";
          const priorityCheckbox = document.createElement("input");
          priorityCheckbox.type = "checkbox";
          priorityCheckbox.checked = t.priority === "high";
          priorityCheckbox.addEventListener("change", () => {
            saveTaskField(t.id, { priority: priorityCheckbox.checked ? "high" : "normal" });
          });
          priorityLabel.appendChild(priorityCheckbox);
          priorityLabel.appendChild(document.createTextNode("High priority"));

          // Deadline: separate date + time inputs (rather than a single
          // datetime-local field) so a date-only deadline stays possible -
          // datetime-local always requires both. Matches the backend's
          // "YYYY-MM-DD" or "YYYY-MM-DDTHH:MM" shape (project_manager.
          // _parse_task_deadline): time is only combined in when present,
          // and clearing the date clears the whole deadline.
          const deadlineWrap = document.createElement("div");
          deadlineWrap.className = "card-deadline-wrap";
          const deadlineDateInput = document.createElement("input");
          deadlineDateInput.type = "date";
          deadlineDateInput.className = "card-deadline-date-input";
          deadlineDateInput.title = "Deadline date";
          const deadlineTimeInput = document.createElement("input");
          deadlineTimeInput.type = "time";
          deadlineTimeInput.className = "card-deadline-time-input";
          deadlineTimeInput.title = "Deadline time (optional)";
          if (t.deadline) {
            const [datePart, timePart] = t.deadline.split("T");
            deadlineDateInput.value = datePart;
            if (timePart) deadlineTimeInput.value = timePart;
          }
          const saveDeadline = () => {
            if (!deadlineDateInput.value) {
              deadlineTimeInput.value = "";
              saveTaskField(t.id, { deadline: "" });
              return;
            }
            const deadline = deadlineTimeInput.value
              ? `${deadlineDateInput.value}T${deadlineTimeInput.value}`
              : deadlineDateInput.value;
            saveTaskField(t.id, { deadline });
          };
          deadlineDateInput.addEventListener("change", saveDeadline);
          deadlineTimeInput.addEventListener("change", saveDeadline);
          deadlineWrap.appendChild(deadlineDateInput);
          deadlineWrap.appendChild(deadlineTimeInput);

          // Duration: free text, same shapes project_manager._parse_task_duration
          // accepts ("45m", "1h30m", "90", ...). Empty clears it.
          const durationInput = document.createElement("input");
          durationInput.type = "text";
          durationInput.className = "card-duration-input";
          durationInput.placeholder = "Duration (e.g. 45m)";
          durationInput.value = t.duration_minutes != null ? formatDurationInput(t.duration_minutes) : "";
          durationInput.addEventListener("change", () => saveTaskField(t.id, { duration: durationInput.value }));

          // Effort: select, empty option clears it.
          const effortSelect = document.createElement("select");
          effortSelect.className = "card-effort-select";
          for (const [value, label] of [["", "Effort (unset)"], ["low", "Low effort"], ["medium", "Medium effort"], ["high", "High effort"]]) {
            const opt = document.createElement("option");
            opt.value = value;
            opt.textContent = label;
            effortSelect.appendChild(opt);
          }
          effortSelect.value = t.effort || "";
          effortSelect.addEventListener("change", () => saveTaskField(t.id, { effort: effortSelect.value }));

          // When: time-of-day + optional weekday/weekend modifier, combined
          // into the single canonical string project_manager._parse_task_when
          // expects (e.g. "afternoon weekend"). Clearing the time word
          // clears the whole field.
          const whenWrap = document.createElement("div");
          whenWrap.className = "card-when-wrap";
          const [whenTimePart, whenModifierPart] = (t.when || "").split(" ");
          const whenTimeSelect = document.createElement("select");
          whenTimeSelect.className = "card-when-time-select";
          for (const [value, label] of [["", "When (unset)"], ["morning", "Morning"], ["afternoon", "Afternoon"], ["evening", "Evening"]]) {
            const opt = document.createElement("option");
            opt.value = value;
            opt.textContent = label;
            whenTimeSelect.appendChild(opt);
          }
          whenTimeSelect.value = whenTimePart || "";
          const whenModifierSelect = document.createElement("select");
          whenModifierSelect.className = "card-when-modifier-select";
          for (const [value, label] of [["", "Any day"], ["weekday", "Weekday"], ["weekend", "Weekend"]]) {
            const opt = document.createElement("option");
            opt.value = value;
            opt.textContent = label;
            whenModifierSelect.appendChild(opt);
          }
          whenModifierSelect.value = whenModifierPart || "";
          const saveWhen = () => {
            if (!whenTimeSelect.value) {
              whenModifierSelect.value = "";
              saveTaskField(t.id, { when: "" });
              return;
            }
            const when = whenModifierSelect.value ? `${whenTimeSelect.value} ${whenModifierSelect.value}` : whenTimeSelect.value;
            saveTaskField(t.id, { when });
          };
          whenTimeSelect.addEventListener("change", saveWhen);
          whenModifierSelect.addEventListener("change", saveWhen);
          whenWrap.appendChild(whenTimeSelect);
          whenWrap.appendChild(whenModifierSelect);

          card.appendChild(titleInput);
          card.appendChild(notesInput);
          card.appendChild(deadlineWrap);
          card.appendChild(durationInput);
          card.appendChild(effortSelect);
          card.appendChild(whenWrap);
          card.appendChild(priorityLabel);
        } else {
          card.draggable = true;
          const flag = t.priority === "high" ? '<span class="card-priority-flag" title="High priority">&#10071;</span>' : "";
          const note = t.notes ? `<span class="card-note">${t.notes}</span>` : "";
          const deadline = t.deadline ? `<span class="card-deadline">Due ${formatDeadline(t.deadline)}</span>` : "";
          const properties = formatTaskProperties(t);
          const propertiesLine = properties ? `<span class="card-properties">${properties}</span>` : "";
          card.innerHTML = `${flag}<span class="card-title">${t.title}</span>${deadline}${propertiesLine}${note}`;
          card.addEventListener("dragstart", (e) => {
            card.classList.add("dragging");
            e.dataTransfer.setData("text/plain", t.id);
            e.dataTransfer.effectAllowed = "move";
          });
          card.addEventListener("dragend", () => card.classList.remove("dragging"));
        }
        cards.appendChild(card);
      }
      col.appendChild(cards);

      col.addEventListener("dragover", (e) => {
        if (boardEditMode) return;
        e.preventDefault();
        col.classList.add("drag-over");
      });
      col.addEventListener("dragleave", () => col.classList.remove("drag-over"));
      col.addEventListener("drop", async (e) => {
        if (boardEditMode) return;
        e.preventDefault();
        col.classList.remove("drag-over");
        const taskId = e.dataTransfer.getData("text/plain");
        const task = tasks.find((t) => t.id === taskId);
        if (!task || task.status === s.key) return;
        try {
          const res = await fetch(`/projects/${boardProjectId}/tasks/${taskId}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: s.key }),
          });
          if (!res.ok) throw new Error((await res.json()).detail || "Request failed");
          await loadBoard(boardProjectId);
        } catch (err) {
          showStatus(err.message, false);
        }
      });

      board.appendChild(col);
    }
    boardHint.hidden = true;
    board.hidden = false;
  }

  function toDateInputValue(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function getDragLabel() {
    if (!dragLabelEl) {
      dragLabelEl = document.createElement("div");
      dragLabelEl.className = "bar-drag-label";
      document.body.appendChild(dragLabelEl);
    }
    return dragLabelEl;
  }

  function showDragLabel(handleEl, date) {
    const label = getDragLabel();
    label.textContent = date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    label.style.display = "block";
    const handleRect = handleEl.getBoundingClientRect();
    const labelRect = label.getBoundingClientRect();
    label.style.left = `${handleRect.left + handleRect.width / 2 - labelRect.width / 2}px`;
    label.style.top = `${handleRect.top - labelRect.height - 8}px`;
  }

  function hideDragLabel() {
    if (dragLabelEl) dragLabelEl.style.display = "none";
  }

  // Track which handle (left/right border) started the current drag so
  // on_date_change below knows which date to show and where to anchor the label.
  document.addEventListener("mousedown", (e) => {
    const handle = e.target.closest(".handle.left, .handle.right");
    if (!handle) return;
    const wrapper = handle.closest(".bar-wrapper");
    if (!wrapper) return;
    activeDrag = {
      taskId: wrapper.getAttribute("data-id"),
      side: handle.classList.contains("left") ? "left" : "right",
    };
  });
  document.addEventListener("mouseup", () => {
    activeDrag = null;
    hideDragLabel();
  });

  // frappe-gantt fires its date_change event on every mousemove while a bar
  // border is being dragged, not just once on release. Debounce so only the
  // final position (settled once the mouse stops, i.e. on release) is saved.
  const pendingBarSaves = {};
  function saveBarDates(task, start, end) {
    if (activeDrag && activeDrag.taskId === task.id) {
      const wrapper = document.querySelector(`.bar-wrapper[data-id="${task.id}"]`);
      const handleEl = wrapper && wrapper.querySelector(`.handle.${activeDrag.side}`);
      if (handleEl) showDragLabel(handleEl, activeDrag.side === "left" ? start : end);
    }
    clearTimeout(pendingBarSaves[task.id]);
    pendingBarSaves[task.id] = setTimeout(async () => {
      try {
        const res = await fetch(`/projects/${task.id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            gantt_start: toDateInputValue(start),
            gantt_end: toDateInputValue(end),
          }),
        });
        if (!res.ok) throw new Error((await res.json()).detail || "Request failed");
        showStatus("Saved.", true);
        await loadProjects();
      } catch (e) {
        showStatus(e.message, false);
        await loadGantt();
      }
    }, 300);
  }

  async function loadGantt() {
    const res = await fetch("/gantt");
    const data = await res.json();
    const rows = data.rows || [];
    ganttEmpty.hidden = rows.length > 0;
    chartArea.style.display = rows.length ? "flex" : "none";
    if (!rows.length) return;
    if (ganttInstance) {
      ganttInstance.refresh(rows);
    } else {
      ganttInstance = new Gantt("#gantt", rows, {
        view_mode: currentViewMode,
        date_format: "YYYY-MM-DD",
        readonly_progress: true,
        on_click: (task) => {
          document.querySelectorAll(".bar-wrapper.selected").forEach((el) => el.classList.remove("selected"));
          const wrapper = document.querySelector(`.bar-wrapper[data-id="${task.id}"]`);
          if (wrapper) wrapper.classList.add("selected");
          showProjectTasks(task.id);
          loadBoard(task.id);
        },
        on_date_change: (task, start, end) => saveBarDates(task, start, end),
      });
    }
  }

  function setDatesPanelCollapsed(collapsed) {
    datesBody.hidden = collapsed;
    datesToggle.setAttribute("aria-expanded", String(!collapsed));
    try { localStorage.setItem("gantt.datesPanelCollapsed", collapsed ? "1" : "0"); } catch (e) {}
  }

  datesToggle.addEventListener("click", () => {
    setDatesPanelCollapsed(!datesBody.hidden);
  });

  function setSidebarCollapsed(collapsed) {
    taskSidebar.classList.toggle("collapsed", collapsed);
    sidebarToggle.textContent = collapsed ? "▶" : "◀";
    sidebarToggle.title = collapsed ? "Expand" : "Collapse";
    try { localStorage.setItem("gantt.sidebarCollapsed", collapsed ? "1" : "0"); } catch (e) {}
  }

  sidebarToggle.addEventListener("click", () => {
    setSidebarCollapsed(!taskSidebar.classList.contains("collapsed"));
  });

  projectSelect.addEventListener("change", fillDatesFromSelection);
  zoomOutBtn.addEventListener("click", () => setViewMode("Month"));
  zoomInBtn.addEventListener("click", () => setViewMode("Week"));

  document.getElementById("saveBtn").addEventListener("click", async () => {
    const projectId = projectSelect.value;
    if (!projectId) return;
    const body = {};
    if (startInput.value) body.gantt_start = startInput.value;
    if (endInput.value) body.gantt_end = endInput.value;
    if (!body.gantt_start && !body.gantt_end) {
      showStatus("Set a start and/or end date first.", false);
      return;
    }
    try {
      const res = await fetch(`/projects/${projectId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error((await res.json()).detail || "Request failed");
      showStatus("Saved.", true);
      await loadProjects();
      await loadGantt();
    } catch (e) {
      showStatus(e.message, false);
    }
  });

  document.getElementById("clearBtn").addEventListener("click", async () => {
    const projectId = projectSelect.value;
    if (!projectId) return;
    try {
      const res = await fetch(`/projects/${projectId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ clear_gantt_dates: true }),
      });
      if (!res.ok) throw new Error((await res.json()).detail || "Request failed");
      showStatus("Cleared.", true);
      startInput.value = "";
      endInput.value = "";
      await loadProjects();
      await loadGantt();
    } catch (e) {
      showStatus(e.message, false);
    }
  });

  (async function init() {
    let collapsed = false;
    try { collapsed = localStorage.getItem("gantt.datesPanelCollapsed") === "1"; } catch (e) {}
    setDatesPanelCollapsed(collapsed);
    let sidebarCollapsed = false;
    try { sidebarCollapsed = localStorage.getItem("gantt.sidebarCollapsed") === "1"; } catch (e) {}
    setSidebarCollapsed(sidebarCollapsed);
    zoomOutBtn.classList.toggle("active", currentViewMode === "Month");
    zoomInBtn.classList.toggle("active", currentViewMode === "Week");
    await loadProjects();
    await loadGantt();
  })();
})();
</script>
</body>
</html>
