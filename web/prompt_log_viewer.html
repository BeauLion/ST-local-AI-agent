<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prompt &amp; Console Log Viewer</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1b1e24;
    --panel-2: #21252c;
    --border: #2c313a;
    --text: #d7dae0;
    --text-dim: #8b93a1;
    --accent: #5fa8ff;
    --mono: "Consolas", "SF Mono", "Cascadia Mono", monospace;
    --sans: -apple-system, "Segoe UI", sans-serif;

    --c-system: #7c9cff;
    --c-user: #57c785;
    --c-assistant: #ffb454;
    --c-tool: #ff7a90;
    --c-tools: #c58fff;
    --c-console: #6fd1c9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
  }
  select, input[type="text"], button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    font-family: var(--sans);
  }
  select:focus, input[type="text"]:focus { outline: 1px solid var(--accent); }
  input[type="text"] { min-width: 220px; }
  button {
    cursor: pointer;
    border-color: var(--accent);
    color: var(--accent);
  }
  button:hover { background: #223047; }

  .layout { display: flex; }
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 16px;
    height: calc(100vh - 61px);
    overflow-y: auto;
    position: sticky;
    top: 61px;
  }
  .sidebar h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--text-dim);
    margin: 18px 0 8px;
  }
  .sidebar h2:first-child { margin-top: 0; }
  label.chk {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 3px 0;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
  }
  label.chk input { accent-color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .req-item {
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 2px;
    border: 1px solid transparent;
  }
  .req-item:hover { background: var(--panel-2); }
  .req-item.active {
    background: #223047;
    border-color: var(--accent);
  }
  .req-item .req-title {
    font-size: 12.5px;
    color: var(--text);
    font-family: var(--mono);
  }
  .req-item .req-meta {
    font-size: 11px;
    color: var(--text-dim);
  }

  main { flex: 1; padding: 18px 22px; max-width: 980px; }
  .status { color: var(--text-dim); font-size: 13px; margin-bottom: 14px; }

  .iteration {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 18px;
    overflow: hidden;
  }
  .iteration-head {
    background: var(--panel);
    padding: 8px 14px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }
  .chunk {
    border-top: 1px solid var(--border);
  }
  .chunk-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    cursor: pointer;
    background: var(--panel);
  }
  .chunk-head:hover { background: var(--panel-2); }
  .badge {
    font-family: var(--mono);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: .04em;
    font-weight: 600;
  }
  .badge.role-system { background: #202b4d; color: var(--c-system); }
  .badge.role-user { background: #16302233; color: var(--c-user); }
  .badge.role-assistant { background: #3a2c10; color: var(--c-assistant); }
  .badge.role-tool { background: #3a1620; color: var(--c-tool); }
  .badge.role-tools { background: #2a1a3a; color: var(--c-tools); }
  .badge.role-console { background: #103a36; color: var(--c-console); }
  .section-name {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }
  .char-count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  .chunk-body {
    display: none;
    padding: 12px 14px;
    background: #101216;
    border-top: 1px solid var(--border);
  }
  .chunk-body.open { display: block; }
  .chunk-body pre {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text);
    max-height: 480px;
    overflow-y: auto;
  }
  .chunk.role-console-chunk .chunk-body pre { color: var(--c-console); }
  mark { background: #5fa8ff55; color: inherit; border-radius: 2px; }
  .empty { color: var(--text-dim); padding: 30px 0; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>Prompt &amp; Console Log Viewer</h1>
  <select id="fileSelect"></select>
  <input type="text" id="searchBox" placeholder="Search chunk content...">
  <button id="expandAllBtn">Expand all</button>
  <button id="collapseAllBtn">Collapse all</button>
</header>

<div class="layout">
  <div class="sidebar">
    <h2>Request</h2>
    <div id="requestFilter"></div>
    <h2>Role</h2>
    <div id="roleFilters"></div>
    <h2>Chunk / Section</h2>
    <div id="sectionFilters"></div>
  </div>

  <main>
    <div class="status" id="status">Loading...</div>
    <div id="results"></div>
  </main>
</div>

<script>
const ROLE_COLORS = {
  system: 'role-system', user: 'role-user', assistant: 'role-assistant',
  tool: 'role-tool', tools: 'role-tools', console: 'role-console',
};

let allEntries = [];
let groups = [];
let activeRoles = new Set();
let activeSections = new Set();
let selectedEntryIndex = null; // null = show all requests

// Older log files (written before console capture existed) have entries
// with no "type" field at all - infer "prompt" for those from the
// presence of "chunks", "console" otherwise, so old logs still load fine.
function entryType(e) {
  return e.type || (e.chunks ? 'prompt' : 'console');
}

// Console entries are always written immediately after the prompt entry
// they belong to (see main.py's _log_console). Pair them up here so the
// rest of the page can treat "one iteration" as one thing to render,
// instead of two separate array elements. A console entry with no
// preceding prompt (rare - e.g. the max-iterations bail-out case) still
// gets its own standalone group so nothing is silently dropped.
function buildGroups(entries) {
  const out = [];
  let i = 0;
  while (i < entries.length) {
    const e = entries[i];
    if (entryType(e) === 'console') {
      out.push({ prompt: null, console: e });
      i++;
      continue;
    }
    const group = { prompt: e, console: null };
    const next = entries[i + 1];
    if (next && entryType(next) === 'console') {
      group.console = next;
      i += 2;
    } else {
      i += 1;
    }
    out.push(group);
  }
  return out;
}

// A group's console lines are exposed as one more chunk, so the existing
// role/section filter + collapsible-chunk UI handles it for free.
function groupChunks(group) {
  const chunks = group.prompt ? [...group.prompt.chunks] : [];
  if (group.console) {
    chunks.push({
      role: 'console',
      section: 'console_output',
      content: group.console.lines.join('\n'),
    });
  }
  return chunks;
}

function groupRef(group) {
  return group.prompt || group.console;
}

async function loadFileList() {
  const res = await fetch('/prompt-logs');
  const files = await res.json();
  const sel = document.getElementById('fileSelect');
  sel.innerHTML = '';
  if (!files.length) {
    document.getElementById('status').textContent = 'No log files found in prompt_logs/ yet - send a message through SillyTavern first.';
    return;
  }
  for (const f of files) {
    const opt = document.createElement('option');
    opt.value = f.filename;
    opt.textContent = `${f.filename}  (${f.size_kb} KB)`;
    sel.appendChild(opt);
  }
  sel.addEventListener('change', () => loadFile(sel.value));
  await loadFile(files[0].filename);
}

async function loadFile(filename) {
  document.getElementById('status').textContent = 'Loading ' + filename + '...';
  const res = await fetch('/prompt-logs/' + encodeURIComponent(filename));
  allEntries = await res.json();
  groups = buildGroups(allEntries);
  selectedEntryIndex = null;
  buildRequestList();
  buildFilterLists();
  render();
}

function buildRequestList() {
  const box = document.getElementById('requestFilter');
  box.innerHTML = '';

  const allItem = document.createElement('div');
  allItem.className = 'req-item' + (selectedEntryIndex === null ? ' active' : '');
  allItem.innerHTML = `<span class="req-title">All requests</span><span class="req-meta">${groups.length} total</span>`;
  allItem.addEventListener('click', () => {
    selectedEntryIndex = null;
    buildRequestList();
    render();
  });
  box.appendChild(allItem);

  groups.forEach((group, idx) => {
    const ref = groupRef(group);
    const time = (ref.timestamp || '').split('T')[1]?.split('.')[0] || ref.timestamp || '?';
    const consoleMark = group.console ? ' \u{1F5A5}' : ''; // small monitor icon = has console output
    const item = document.createElement('div');
    item.className = 'req-item' + (selectedEntryIndex === idx ? ' active' : '');
    item.innerHTML = `
      <span class="req-title">iteration ${ref.iteration} &middot; ${time}${consoleMark}</span>
      <span class="req-meta">${groupChunks(group).length} chunks</span>`;
    item.addEventListener('click', () => {
      selectedEntryIndex = idx;
      buildRequestList();
      render();
    });
    box.appendChild(item);
  });
}

function buildFilterLists() {
  const roles = new Set();
  const sections = new Set();
  for (const group of groups) {
    for (const c of groupChunks(group)) {
      roles.add(c.role);
      sections.add(c.section);
    }
  }
  activeRoles = new Set(roles);
  activeSections = new Set(sections);

  const roleBox = document.getElementById('roleFilters');
  roleBox.innerHTML = '';
  for (const r of [...roles].sort()) {
    const id = 'role-' + r;
    const colorKey = ROLE_COLORS[r] ? ROLE_COLORS[r].replace('role-', '') : 'tools';
    roleBox.insertAdjacentHTML('beforeend', `
      <label class="chk">
        <input type="checkbox" id="${id}" checked>
        <span class="dot" style="background:var(--c-${colorKey})"></span>
        ${r}
      </label>`);
  }
  roleBox.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('change', () => {
      const r = inp.id.replace('role-', '');
      inp.checked ? activeRoles.add(r) : activeRoles.delete(r);
      render();
    });
  });

  const secBox = document.getElementById('sectionFilters');
  secBox.innerHTML = '';
  for (const s of [...sections].sort()) {
    const id = 'sec-' + s;
    secBox.insertAdjacentHTML('beforeend', `
      <label class="chk">
        <input type="checkbox" id="${id}" checked>
        ${s}
      </label>`);
  }
  secBox.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('change', () => {
      const s = inp.id.replace('sec-', '');
      inp.checked ? activeSections.add(s) : activeSections.delete(s);
      render();
    });
  });
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]));
}

function highlight(text, query) {
  const escaped = escapeHtml(text);
  if (!query) return escaped;
  const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escaped.replace(new RegExp('(' + safeQuery + ')', 'ig'), '<mark>$1</mark>');
}

function render() {
  const query = document.getElementById('searchBox').value.trim();
  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '';
  let shownIterations = 0;
  let shownChunks = 0;

  const groupsToShow = selectedEntryIndex === null
    ? groups
    : [groups[selectedEntryIndex]];

  for (const group of groupsToShow) {
    if (!group) continue;
    const ref = groupRef(group);
    const matchingChunks = groupChunks(group).filter(c => {
      if (!activeRoles.has(c.role)) return false;
      if (!activeSections.has(c.section)) return false;
      if (query && !c.content.toLowerCase().includes(query.toLowerCase())) return false;
      return true;
    });
    if (!matchingChunks.length) continue;
    shownIterations++;

    const iterDiv = document.createElement('div');
    iterDiv.className = 'iteration';
    iterDiv.innerHTML = `
      <div class="iteration-head">
        <span>${ref.timestamp}</span>
        <span>iteration ${ref.iteration} &middot; model: ${group.prompt?.model || '?'}</span>
      </div>`;

    for (const c of matchingChunks) {
      shownChunks++;
      const roleClass = ROLE_COLORS[c.role] || 'role-tools';
      const chunkDiv = document.createElement('div');
      chunkDiv.className = 'chunk' + (c.role === 'console' ? ' role-console-chunk' : '');
      chunkDiv.innerHTML = `
        <div class="chunk-head">
          <span class="badge ${roleClass}">${c.role}</span>
          <span class="section-name">${c.section}</span>
          <span class="char-count">${c.content.length.toLocaleString()} chars</span>
        </div>
        <div class="chunk-body"><pre>${highlight(c.content, query)}</pre></div>`;
      const head = chunkDiv.querySelector('.chunk-head');
      const body = chunkDiv.querySelector('.chunk-body');
      head.addEventListener('click', () => body.classList.toggle('open'));
      if (query) body.classList.add('open');
      iterDiv.appendChild(chunkDiv);
    }
    resultsEl.appendChild(iterDiv);
  }

  const focusNote = selectedEntryIndex === null
    ? (groups.length ? ` (of ${groups.length} logged requests total)` : '')
    : ` (focused on iteration ${groupRef(groups[selectedEntryIndex])?.iteration})`;
  document.getElementById('status').textContent =
    `${shownIterations} request${shownIterations === 1 ? '' : 's'} / ${shownChunks} chunk${shownChunks === 1 ? '' : 's'} shown`
    + focusNote;

  if (!shownChunks) {
    resultsEl.innerHTML = '<div class="empty">No chunks match the current filters.</div>';
  }
}

document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('expandAllBtn').addEventListener('click', () => {
  document.querySelectorAll('.chunk-body').forEach(b => b.classList.add('open'));
});
document.getElementById('collapseAllBtn').addEventListener('click', () => {
  document.querySelectorAll('.chunk-body').forEach(b => b.classList.remove('open'));
});

loadFileList();
</script>
</body>
</html>
